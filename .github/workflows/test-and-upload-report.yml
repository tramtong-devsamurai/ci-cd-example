```yaml
name: Test & Upload Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  junit-test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test & generate report
        run: |
          yarn
          yarn junit-test

      - name: Upload report to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/

      - name: Check AgileTest Secrets
        env:
          BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AUTH_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "ERROR: AGILETEST_BASE_URL is EMPTY"
            exit 1
          fi

          if [ -z "$AUTH_URL" ]; then
            echo "ERROR: AGILETEST_AUTH_BASE_URL is EMPTY"
            exit 1
          fi

          if [[ "$BASE_URL" != http://* && "$BASE_URL" != https://* ]]; then
            echo "ERROR: AGILETEST_BASE_URL is missing HTTP/HTTPS"
            exit 1
          fi

          if [[ "$AUTH_URL" != http://* && "$AUTH_URL" != https://* ]]; then
            echo "ERROR: AGILETEST_AUTH_BASE_URL is missing HTTP/HTTPS"
            exit 1
          fi

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: Client credentials are EMPTY"
            exit 1
          fi

          echo "All AgileTest Secrets are configured."

          echo "Checking BASE_URL..."
          curl -sS -o /dev/null -w "BASE_URL HTTP Status: %{http_code}\n" --connect-timeout 10 "$BASE_URL"

          echo "Checking AUTH_URL..."
          curl -sS -o /dev/null -w "AUTH_URL HTTP Status: %{http_code}\n" --connect-timeout 10 "$AUTH_URL"

      - name: Upload report to AgileTest.App
        env:
          AGILETEST_BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AGILETEST_AUTH_BASE_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          AGILETEST_CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          AGILETEST_CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          docker run --rm \
            -e AGILETEST_BASE_URL \
            -e AGILETEST_AUTH_BASE_URL \
            -e AGILETEST_CLIENT_ID \
            -e AGILETEST_CLIENT_SECRET \
            -v "${{ github.workspace }}/reports:/reports" \
            ghcr.io/agiletestapp/agiletest-cli:latest \
            test-execution import --framework-type junit --project-key FOR \
            /reports/junit-report.xml
```