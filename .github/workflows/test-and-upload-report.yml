```yaml
name: Test & Upload Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  junit-test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test & generate report
        run: |
          yarn
          yarn junit-test

      - name: Upload report to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/

      - name: Check AgileTest Secrets
        env:
          AGILETEST_BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AGILETEST_AUTH_BASE_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          AGILETEST_CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          AGILETEST_CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          for name in AGILETEST_BASE_URL AGILETEST_AUTH_BASE_URL; do
            value="${!name}"

            if [ -z "$value" ]; then
              echo "ERROR: $name is EMPTY"
              exit 1
            elif [[ "$value" =~ ^https?://[^/[:space:]]+ ]]; then
              echo "OK: $name has HTTP/HTTPS protocol"
              curl -sS -o /dev/null \
                -w "$name HTTP Status: %{http_code}\n" \
                --connect-timeout 10 "$value"
            else
              echo "ERROR: $name has invalid URL format"
              exit 1
            fi
          done

          for name in AGILETEST_CLIENT_ID AGILETEST_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is EMPTY"
              exit 1
            else
              echo "OK: $name is configured"
            fi
          done

      - name: Upload report to AgileTest.App
        env:
          AGILETEST_BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AGILETEST_AUTH_BASE_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          AGILETEST_CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          AGILETEST_CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          docker run --rm \
            -e AGILETEST_BASE_URL \
            -e AGILETEST_AUTH_BASE_URL \
            -e AGILETEST_CLIENT_ID \
            -e AGILETEST_CLIENT_SECRET \
            -v ${{ github.workspace }}/reports:/reports \
            ghcr.io/agiletestapp/agiletest-cli:latest \
            test-execution import --framework-type junit --project-key FOR \
            /reports/junit-report.xml
```