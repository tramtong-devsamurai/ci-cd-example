
name: Test & Upload Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  junit-test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test & generate report
        run: |
          yarn
          yarn junit-test

      - name: Upload report to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/

      - name: Check AgileTest Secrets
        env:
          AGILETEST_BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AGILETEST_AUTH_BASE_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          AGILETEST_CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          AGILETEST_CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          set -e

          check_url() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "ERROR: $name is EMPTY"
              exit 1
            fi

            if [[ ! "$value" =~ ^https?:// ]]; then
              echo "ERROR: $name is missing HTTP/HTTPS protocol"
              exit 1
            fi

            echo "OK: $name has valid HTTP/HTTPS protocol"

            curl -sS \
              --connect-timeout 10 \
              -o /dev/null \
              -w "$name HTTP Status: %{http_code}\n" \
              "$value"
          }

          check_url "AGILETEST_BASE_URL" "$AGILETEST_BASE_URL"
          check_url "AGILETEST_AUTH_BASE_URL" "$AGILETEST_AUTH_BASE_URL"

          if [ -z "$AGILETEST_CLIENT_ID" ]; then
            echo "ERROR: AGILETEST_CLIENT_ID is EMPTY"
            exit 1
          fi

          if [ -z "$AGILETEST_CLIENT_SECRET" ]; then
            echo "ERROR: AGILETEST_CLIENT_SECRET is EMPTY"
            exit 1
          fi

          echo "OK: Client ID and Client Secret are configured"

      - name: Upload report to AgileTest.App
        env:
          AGILETEST_BASE_URL: ${{ secrets.AGILETEST_BASE_URL }}
          AGILETEST_AUTH_BASE_URL: ${{ secrets.AGILETEST_AUTH_BASE_URL }}
          AGILETEST_CLIENT_ID: ${{ secrets.AGILETEST_CLIENT_ID }}
          AGILETEST_CLIENT_SECRET: ${{ secrets.AGILETEST_CLIENT_SECRET }}
        run: |
          docker run --rm \
            -e AGILETEST_BASE_URL \
            -e AGILETEST_AUTH_BASE_URL \
            -e AGILETEST_CLIENT_ID \
            -e AGILETEST_CLIENT_SECRET \
            -v "${{ github.workspace }}/reports:/reports" \
            ghcr.io/agiletestapp/agiletest-cli:latest \
            test-execution import --framework-type junit --project-key FOR \
            /reports/junit-report.xml
